name: CD

# main deploys to api (production), develop deploys to beta.
# The shared workflow is FINTLabs/fint-core-workflows branch-deploy.yaml.
#
# Each image is tagged sha-<last commit that changed its paths>. Keep the paths
# the same as CLIENT_PATHS and ADAPTER_GATEWAY_PATHS in .github/scripts/paths.sh,
# which CI uses.
on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cd:
    uses: FINTLabs/fint-core-workflows/.github/workflows/branch-deploy.yaml@v1
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      exclude-paths: ""
      services: |
        [
          {"image": "fint-core-client-api-db", "dockerfile": "fint-core-client-api/Dockerfile",
           "paths": "fint-core-client-api fint-core-shared buildSrc build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat"},
          {"image": "fint-core-adapter-gateway-db", "dockerfile": "fint-core-adapter-gateway/Dockerfile",
           "paths": "fint-core-adapter-gateway fint-core-shared buildSrc build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat"}
        ]
