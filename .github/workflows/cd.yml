name: CD

on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      services: ${{ steps.services.outputs.services }}
      orgs: ${{ steps.orgs.outputs.orgs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Map branch to environment
        id: env
        run: |
          case "$GITHUB_REF_NAME" in
            main)    echo "environment=api"  >> "$GITHUB_OUTPUT" ;;
            develop) echo "environment=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "no environment for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Resolve per-service versions
        id: services
        run: |
          eval "$(.github/scripts/service-versions.sh)"
          echo "consumer=$consumer provider=$provider"
          jq -nc --arg c "$consumer" --arg p "$provider" \
            '[{service:"fint-core-consumer", image:"fint-core-consumer-db", sha:$c}, {service:"fint-core-provider-gateway", image:"fint-core-provider-gateway-db", sha:$p}]' \
            | sed 's/^/services=/' >> "$GITHUB_OUTPUT"

      - name: Discover org overlays
        id: orgs
        run: |
          dir="kustomize/overlays/${{ steps.env.outputs.environment }}"
          orgs=$(find "$dir" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; 2>/dev/null | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
          echo "targets in $dir: $orgs"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.services) }}
    env:
      IMAGE: ghcr.io/fintlabs/${{ matrix.image }}:sha-${{ matrix.sha }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether ${{ env.IMAGE }} already exists
        id: exists
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already in registry, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.exists.outputs.exists == 'false'

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.sha }}

  deploy:
    needs: [setup, build]
    if: needs.setup.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJson(needs.setup.outputs.orgs) }}
    environment: ${{ needs.setup.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve cluster + resource group
        id: aks
        run: |
          case "$ENVIRONMENT" in
            beta) echo "cluster=aks-beta-fint-2021-11-23" >> "$GITHUB_OUTPUT" ;;
            api)  echo "cluster=aks-api-fint-2022-02-08"  >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          echo "resource-group=rg-aks-$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment image tags
        id: image_tags
        env:
          SERVICES: ${{ needs.setup.outputs.services }}
        run: |
          {
            echo "images<<EOF"
            jq -r \
              '.[] | "ghcr.io/fintlabs/\(.image):sha-\(.sha)"' \
              <<< "$SERVICES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4.0.0
        with:
          renderEngine: "kustomize"
          kustomizationPath: "kustomize/overlays/${{ env.ENVIRONMENT }}/${{ matrix.org }}"

      - name: Substitute images into baked YAML
        id: substitute
        uses: azure/k8s-artifact-substitute@v2.0.0
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ steps.image_tags.outputs.images }}

      - uses: azure/login@v3.0.0
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', needs.setup.outputs.environment)] }}"

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "0.2.19"

      - name: Set the target cluster
        uses: azure/aks-set-context@v5.0.0
        with:
          cluster-name: "${{ steps.aks.outputs.cluster }}"
          resource-group: "${{ steps.aks.outputs.resource-group }}"
          admin: "true"
          use-kubelogin: "true"

      - name: Ensure namespace ${{ matrix.org }}
        run: kubectl create namespace ${{ matrix.org }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        uses: azure/k8s-deploy@v6.0.0
        with:
          action: deploy
          manifests: ${{ steps.substitute.outputs.manifests }}
          images: ${{ steps.image_tags.outputs.images }}
          pull-images: false
          namespace: ${{ matrix.org }}
