name: Ingress rules

# Fails the build if any overlay breaks the routing policy in
# kustomize/rules-test/test.sh. Runs the rendered rules in the real Traefik
# image.
on:
  pull_request:
    paths: [kustomize/**, .github/workflows/ingress-rules.yml]
  push:
    branches: [main, develop]
    paths: [kustomize/**, .github/workflows/ingress-rules.yml]

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kustomize/rules-test
    steps:
      - uses: actions/checkout@v7
      - name: Render every overlay into a Traefik file-provider config
        run: ./render.sh
      - name: Start Traefik with whoami backends
        run: docker compose up -d --quiet-pull
      - name: Send the header matrix through Traefik
        run: ./test.sh
      - name: Traefik logs
        if: failure()
        run: docker compose logs traefik
      - name: Stop
        if: always()
        run: docker compose down
