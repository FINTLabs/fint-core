name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      adapter-gateway: ${{ steps.filter.outputs['adapter-gateway'] }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
          fi
          .github/scripts/changed-services.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"

  client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :fint-core-client-api:check

  adapter-gateway:
    needs: changes
    if: ${{ needs.changes.outputs['adapter-gateway'] == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :fint-core-adapter-gateway:check

  shared:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :fint-core-shared:check

  ci-ok:
    needs: [client, adapter-gateway, shared]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.client.result }}" = "failure" ] || [ "${{ needs['adapter-gateway'].result }}" = "failure" ] || [ "${{ needs.shared.result }}" = "failure" ]; then
            echo "a module check failed"
            exit 1
          fi
          echo "ok"
