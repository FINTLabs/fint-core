plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
    id 'groovy'
    id 'com.github.ben-manes.versions'
    id 'se.patrikerdes.use-latest-versions'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.jetbrains.kotlin.plugin.lombok'
}

group = 'no.novari'
version = System.getenv("RELEASE_VERSION") ?: '0.0.1-SNAPSHOT'

def fintVersion = '4.0.10'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation project(':fint-core-resource-store')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    implementation "no.novari:fint-utdanning-resource-model-java:${fintVersion}"
    implementation "no.novari:fint-administrasjon-resource-model-java:${fintVersion}"
    implementation "no.novari:fint-personvern-resource-model-java:${fintVersion}"
    implementation "no.novari:fint-okonomi-resource-model-java:${fintVersion}"
    implementation "no.novari:fint-ressurs-resource-model-java:${fintVersion}"
    implementation "no.novari:fint-arkiv-resource-model-java:${fintVersion}"

    implementation "jakarta.annotation:jakarta.annotation-api:3.0.0-M1"
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'

    implementation 'no.fint:fint-event-model:3.0.2'
    implementation 'no.fintlabs:fint-core-infra-models:2.1.0-rc-5'
    implementation 'no.novari:fint-core-principal:4.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:mongodb'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
}

tasks.register('benchmarkKafkaProducer', JavaExec) {
    group = 'verification'
    description = 'Run Kafka producer benchmark against a local Kafka broker'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'no.fintlabs.provider.performance.KafkaProducerBenchmark'

    def benchmarkSystemProperties = System.properties.findAll { entry ->
        entry.key.toString().startsWith('benchmark.')
    }
    systemProperties benchmarkSystemProperties

    project.properties.findAll { entry ->
        entry.key.toString().startsWith('benchmark.')
    }.each { entry ->
        systemProperty(entry.key.toString(), entry.value.toString())
    }
}
kotlin {
    jvmToolchain(25)
}
