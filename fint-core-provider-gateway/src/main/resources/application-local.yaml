server:
  port: 8085
  servlet:
    context-path: /provider

fint:
  provider:
    kafka:
      replicas: 1
  metamodel:
    base-url: http://localhost:8082

spring:
  jpa:
    properties:
      jdbc:
        time_zone: UTC
        lob:
          non_contextual_creation: true
      dialect: org.hibernate.dialect.PostgreSQLDialect
      enable_lazy_load_no_trans: true
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:postgresql://localhost:5436/contract
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: public
  kafka:
    bootstrap-servers: localhost:9092
    security:
      protocol: PLAINTEXT
    consumer:
      group-id: provider
      properties:
        max.poll.records: 1500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: INFO
    "no.fintlabs.provider.sync.BufferReader": DEBUG
