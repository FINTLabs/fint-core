version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    networks:
      - broker-kafka
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.8
    networks:
      - broker-kafka
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - broker-kafka
    depends_on:
      - kafka
    ports:
      - 9090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  postgres:
    image: postgres:18.3
    networks:
      - broker-kafka
    ports:
      - 5436:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contract

  mongodb:
    image: mongo:7.0
    networks:
      - broker-kafka
    ports:
      - 27019:27017

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    networks:
      - broker-kafka
    depends_on:
      - mongodb
    ports:
      - 8474:8474
      - 27017:27018
      - 27018:27018

  toxiproxy-init:
    image: curlimages/curl:8.11.1
    networks:
      - broker-kafka
    depends_on:
      - toxiproxy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        until curl -sf http://toxiproxy:8474/version; do echo "waiting for toxiproxy"; sleep 0.5; done
        curl -sf http://toxiproxy:8474/populate -d '[{"name":"mongo","listen":"0.0.0.0:27018","upstream":"mongodb:27017","enabled":true}]'
        curl -sf -X DELETE http://toxiproxy:8474/proxies/mongo/toxics/mongo_latency || true
        curl -sf http://toxiproxy:8474/proxies/mongo/toxics -d '{"name":"mongo_latency","type":"latency","attributes":{"latency":12,"jitter":2}}'

networks:
  broker-kafka:
    driver: bridge
