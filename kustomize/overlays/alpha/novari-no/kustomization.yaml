apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - org-values.yaml
components:
  - ../../../components/org
patches:
  - target:
      kind: IngressRoute
      name: fint-core-client-api-ingress
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - kind: Rule
            match: 'Host(`alpha.felleskomponent.no`) && PathPrefix(`/`) && !PathPrefix(`/provider`) && !PathPrefix(`/{domain:[a-z]+}/{package:[a-z]+}/provider`) && HeadersRegexp(`x-org-id`, `(^|\.)novari\.no$`)'
            priority: 1000
            services:
              - name: fint-core-client-api
                namespace: novari-no
                port: 8080
