apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - org-values.yaml
  - adapter-gateway-ingress.yaml
components:
  - ../../../components/org
patches:
  - target:
      kind: IngressRoute
      name: fint-core-client-api-ingress
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - kind: Rule
            match: 'Host(`beta.felleskomponent.no`) && PathPrefix(`/`) && !PathPrefix(`/provider`) && !PathPrefix(`/{domain:[a-z]+}/{package:[a-z]+}/provider`) && HeadersRegexp(`x-org-id`, `.+`) && !HeadersRegexp(`x-org-id`, `(^|\.)(afk\.no|agderfk\.no|bfk\.no|ffk\.no|innlandetfylke\.no|mrfylke\.no|nfk\.no|ofk\.no|oslo\.kommune\.no|rogfk\.no|telemarkfylke\.no|tromsfylke\.no|trondelagfylke\.no|vestfoldfylke\.no|vlfk\.no)$`) && !PathPrefix(`/felles/kodeverk`)'
            priority: 1000
            services:
              - name: fint-core-client-api
                namespace: novari-no
                port: 8080
  - target:
      kind: Application
      name: fint-core-adapter-gateway
    patch: |-
      - op: replace
        path: /spec/ingress
        value:
          enabled: false
  - target:
      kind: Application
      name: fint-core-adapter-gateway
    patch: |-
      - op: add
        path: /spec/kafka/acls/-
        value:
          topic: "*fint-core*"
          permission: admin
  - target:
      kind: Application
      name: fint-core-adapter-gateway
    patch: |-
      - op: add
        path: /spec/env/-
        value:
          name: FINT_PROVIDER_EXTRAORGIDS
          value: fintlabs.no,sdworx.com
