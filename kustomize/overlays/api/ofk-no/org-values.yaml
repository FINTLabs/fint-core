apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: ofk.no
  id-dashed: ofk-no
  id-underscore: ofk_no
  org-id-regex: 're:(^|\.)ofk\.no$'
  asset-regex: 're:(^|[,.])ofk\.no(,|$)'
  host: api.felleskomponent.no
  base-url: https://api.felleskomponent.no
  onepassword-itempath: "vaults/aks-api-vault/items/fint-core-ofk-no-cluster-api"
