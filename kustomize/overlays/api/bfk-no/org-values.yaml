apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: bfk.no
  id-dashed: bfk-no
  id-underscore: bfk_no
  org-id-regex: 're:(^|\.)bfk\.no$'
  asset-regex: 're:(^|[,.])bfk\.no(,|$)'
  host: api.felleskomponent.no
  base-url: https://api.felleskomponent.no
  onepassword-itempath: "vaults/aks-api-vault/items/fint-core-bfk-no-cluster-api"
