apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: afk.no
  id-dashed: afk-no
  id-underscore: afk_no
  org-id-regex: 're:(^|\.)afk\.no$'
  asset-regex: 're:(^|[,.])afk\.no(,|$)'
  host: api.felleskomponent.no
  base-url: https://api.felleskomponent.no
  onepassword-itempath: "vaults/aks-api-vault/items/fint-core-afk-no-cluster-api"
