apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: ffk.no
  id-dashed: ffk-no
  id-underscore: ffk_no
  org-id-regex: 're:(^|\.)ffk\.no$'
  asset-regex: 're:(^|[,.])ffk\.no(,|$)'
  host: api.felleskomponent.no
  base-url: https://api.felleskomponent.no
  onepassword-itempath: "vaults/aks-api-vault/items/fint-core-ffk-no-cluster-api"
