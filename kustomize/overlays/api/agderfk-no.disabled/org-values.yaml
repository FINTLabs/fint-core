apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: agderfk.no
  id-dashed: agderfk-no
  id-underscore: agderfk_no
  org-id-regex: 're:(^|\.)agderfk\.no$'
  asset-regex: 're:(^|[,.])agderfk\.no(,|$)'
  host: api.felleskomponent.no
  base-url: https://api.felleskomponent.no
  onepassword-itempath: "vaults/aks-api-vault/items/fint-core-agderfk-no-cluster-api"
