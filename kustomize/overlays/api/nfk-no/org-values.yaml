apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: nfk.no
  id-dashed: nfk-no
  id-underscore: nfk_no
  org-id-regex: 're:(^|\.)nfk\.no$'
  asset-regex: 're:(^|[,.])nfk\.no(,|$)'
  host: api.felleskomponent.no
  base-url: https://api.felleskomponent.no
  onepassword-itempath: "vaults/aks-api-vault/items/fint-core-nfk-no-cluster-api"
