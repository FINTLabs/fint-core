apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - org-values.yaml
components:
  - ../../../components/utdanning-gated
  - ../../../components/okonomi-regnskap
  - ../../../components/personvern-samtykke
  - ../../../components/org
patches:
  - target:
      group: fintlabs.no
      version: v1alpha1
      kind: Application
      name: fint-core-client-api
    patch: |-
      - op: replace
        path: /spec/resources/requests/memory
        value: 8Gi
      - op: replace
        path: /spec/resources/limits/memory
        value: 8.5Gi
