apiVersion: v1
kind: ConfigMap
metadata:
  name: fint-org
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  id-dotted: telemarkfylke.no
  id-dashed: telemarkfylke-no
  id-underscore: telemarkfylke_no
  org-id-regex: 're:(^|\.)telemarkfylke\.no$'
