apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - org-values.yaml
components:
  - ../../../components/org
patches:
  # novari.no is a test org, so the client-api takes every client path for it. Traefik ranks a rule
  # by its length, and the priority keeps a longer rule of another backend from winning.
  - target:
      kind: IngressRoute
      name: fint-core-client-api-ingress
    patch: |-
      - op: replace
        path: /spec/routes
        value:
          - kind: Rule
            match: 'Host(`api.felleskomponent.no`) && PathPrefix(`/`) && !PathPrefix(`/provider`) && !PathPrefix(`/{domain:[a-z]+}/{package:[a-z]+}/provider`) && HeadersRegexp(`x-org-id`, `(^|\.)novari\.no$`)'
            priority: 1000
            services:
              - name: fint-core-client-api
                namespace: novari-no
                port: 8080
  # The topic cleanup in the admin API can only delete a topic that this gateway has access to.
  - target:
      kind: Application
      name: fint-core-adapter-gateway
    patch: |-
      - op: add
        path: /spec/kafka/acls/-
        value:
          topic: "*fint-core*"
          permission: admin
