# Sends okonomi regnskap to the client-api. For api, where core 1 still serves faktura and kodeverk.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: IngressRoute
      name: fint-core-client-api-ingress
    patch: |-
      - op: add
        path: /spec/routes/-
        value:
          kind: Rule
          match: 'Host(`REPLACE`) && HeadersRegexp(`x-org-id`, `REPLACE`) && PathPrefix(`/okonomi/regnskap`) && !PathPrefix(`/{domain:[a-z]+}/{package:[a-z]+}/provider`)'
          services:
            - name: fint-core-client-api
              namespace: REPLACE-DASHED
              port: 8080
