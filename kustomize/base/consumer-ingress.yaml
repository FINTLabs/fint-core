apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fint-core-client-api-ingress
  namespace: REPLACE-DASHED
  labels:
    app.kubernetes.io/name: fint-core-client-api
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: fint-core
    fintlabs.no/team: core
    fintlabs.no/org-id: REPLACE
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: 'Host(`REPLACE`) && (PathPrefix(`/felles`) || PathPrefix(`/personvern`) || PathPrefix(`/ressurs`) || PathPrefix(`/utdanning`) || PathPrefix(`/okonomi`)) && !PathPrefix(`/{domain:[a-z]+}/{package:[a-z]+}/provider`) && !PathPrefix(`/felles/kodeverk`) && HeadersRegexp(`x-org-id`, `REPLACE`) && (!(PathPrefix(`/utdanning/{p:(elev|kodeverk|timeplan|utdanningsprogram|vurdering)}`) || PathPrefix(`/okonomi/{p:(faktura|kodeverk)}`)) || (HeadersRegexp(`x-fint-model-version-override`, `(?i)^v4$`) || HeadersRegexp(`x-fint-version-override`, `(?i)^v4$`) || (!HeadersRegexp(`x-fint-model-version-override`, `(?i)^v3$`) && !HeadersRegexp(`x-fint-version-override`, `(?i)^v3$`) && HeadersRegexp(`x-fint-model-version`, `(?i)^v4$`))))'
      services:
        - name: fint-core-client-api
          namespace: REPLACE-DASHED
          port: 8080
