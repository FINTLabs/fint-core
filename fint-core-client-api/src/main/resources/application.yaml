fint:
  relation:
    base-url: https://api.felleskomponent.no
  consumer:
    base-url: ${fint.relation.base-url}
    org-id: ${fint.org-id} # fint.org-id is sat by the FlaisApplication in environment
    event:
      answer-deadline: 15m
      retention: 30m

spring:
  application:
    name: fint-core-client-api
  config:
    import:
      - classpath:shared-mongodb.yaml
  mongodb:
    database: fint
    ssl:
      enabled: true
      bundle: database
  # MongoDB uses this named bundle to create a TLS 1.3-only SSL context while
  # retaining the JVM's default trust material. Keep it to prevent TLS fallback.
  ssl:
    bundle:
      jks:
        database:
          protocol: TLSv1.3
  threads:
    virtual:
      enabled: true
  kafka:
    properties:
      "[ssl.protocol]": TLSv1.3
      "[ssl.enabled.protocols]": TLSv1.3
    consumer:
      group-id: fint-core-client-api-${fint.org-id}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health

logging:
  level:
    org.apache.kafka: WARN
