fint:
  relation:
    base-url: https://api.felleskomponent.no
  consumer:
    base-url: ${fint.relation.base-url}
    org-id: ${fint.org-id}

spring:
  threads:
    virtual:
      enabled: true
  kafka:
    consumer:
      group-id: fint-core-client-api-${fint.org-id}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health

logging:
  level:
    org.apache.kafka: WARN
