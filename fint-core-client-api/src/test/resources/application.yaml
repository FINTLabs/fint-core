fint:
  relation:
    base-url: https://api.felleskomponent.no
  consumer:
    base-url: ${fint.relation.base-url}
    org-id: ${fint.org-id}

spring:
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health

logging:
  level:
    org.apache.kafka: WARN
