fint:
  security:
    exposed-endpoints:
      - /bob
      - /utdanning/vurdering/**
  relation:
    base-url: https://test.felleskomponent.no
  consumer:
    pod-url: http://fint-core-client-api-${fint.consumer.domain}-${fint.consumer.package}:8080
    domain: utdanning
    package: vurdering
    org-id: fintlabs.no

spring:
  kafka:
    consumer:
      group-id: fint-core-client-api
      auto-offset-reset: earliest
logging:
  level:
    org.apache.kafka: OFF
