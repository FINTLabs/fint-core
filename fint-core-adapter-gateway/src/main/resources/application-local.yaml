server:
  port: 8085

fint:
  org-id: novari.no
  provider:
    kafka:
      replicas: 1

spring:
  main:
    banner-mode: console
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5436/contract
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: public
  kafka:
    bootstrap-servers: localhost:9092
    security:
      protocol: PLAINTEXT
    consumer:
      properties:
        max.poll.records: 1500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      console: ""
  level:
    root: INFO
    "no.fintlabs.adapter.gateway.sync.BufferReader": DEBUG
