fint:
  provider:
    org-id: ${fint.org-id} # fint.org-id is sat by the FlaisApplication in environment
    kafka:
      replicas: 2
    resource-ttl:
      max-age: P21D
      sweep-interval: PT1H

spring:
  application:
    name: provider
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: ${fint.database.url}
    username: ${fint.database.username}
    password: ${fint.database.password}
    driver-class-name: org.postgresql.Driver
  config:
    import:
      - classpath:shared-mongodb.yaml
  mongodb:
    database: fint
  threads:
    virtual:
      enabled: true
  kafka:
    security:
      protocol: SSL
    admin:
      modify-topic-configs: true
    producer:
      batch-size: 64KB
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /provider/v3/api-docs
  swagger-ui:
    path: /provider/swagger-ui.html

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
server:
  tomcat:
    max-connections: 30000
