server:
  port: 0 # 0 tells Spring to pick a random available port to avoid port conflicts during CI/CD
  servlet:
    context-path: /provider

fint:
  provider:
    org-id: fintlabs.no
    kafka:
      replicas: 1
  metamodel:
    base-url: http://localhost:8082 # You can mock this using WireMock later if your service actually calls it
spring:
  application:
    name: provider-test
  jpa:
    properties:
      jdbc:
        time_zone: UTC
        lob:
          non_contextual_creation: true
      enable_lazy_load_no_trans: true
    hibernate:
      ddl-auto: create-drop
  kafka:
    # MAGIC HAPPENS HERE: This variable is automatically populated by the @EmbeddedKafka annotation
    bootstrap-servers: localhost:19092  #${spring.embedded.kafka.brokers}
    security:
      protocol: PLAINTEXT
    consumer:
      group-id: provider-test-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Ensure Kafka producer doesn't block forever if embedded Kafka acts up
      properties:
        max.block.ms: 5000

logging:
  level:
    root: INFO
    no.fintlabs: DEBUG # Helpful to see your datasync logs during testing
