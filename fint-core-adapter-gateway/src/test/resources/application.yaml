server:
  port: 0 # 0 tells Spring to pick a random available port to avoid port conflicts during CI/CD

fint:
  provider:
    org-id: fintlabs.no
    kafka:
      replicas: 1
    resource-ttl:
      enabled: false
spring:
  application:
    name: provider-test
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    # MAGIC HAPPENS HERE: This variable is automatically populated by the @EmbeddedKafka annotation
    bootstrap-servers: localhost:19092  #${spring.embedded.kafka.brokers}
    security:
      protocol: PLAINTEXT
    consumer:
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Ensure Kafka producer doesn't block forever if embedded Kafka acts up
      properties:
        max.block.ms: 5000

logging:
  level:
    root: INFO
    no.fintlabs: DEBUG # Helpful to see your datasync logs during testing

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /provider/v3/api-docs
  swagger-ui:
    path: /provider/swagger-ui.html
