fint:
  security:
    opa:
      enabled: false
      url: http://localhost:8181
      env-header: true
  relation:
    base-url: https://api.felleskomponent.no
  consumer:
    base-url: ${fint.relation.base-url}
    domain: utdanning
    package: vurdering
    packageName: ${fint.consumer.package}
    org-id: fintlabs.no
    kafka:
      bootstrap-topics: true
      startup-jitter: 0s

spring:
  threads:
    virtual:
      enabled: true
  kafka:
    consumer:
      group-id: fint-core-consumer
    bootstrap-servers: localhost:9092
logging:
  level:
    org.apache.kafka: OFF
    no.fintlabs.cache: DEBUG
    no.fintlabs.resource.server: DEBUG
