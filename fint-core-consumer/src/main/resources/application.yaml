fint:
  security:
    opa:
      enabled: false
    exposed-endpoints:
      - /actuator/prometheus
      - /actuator/health
  relation:
    base-url: https://api.felleskomponent.no
  consumer:
    pod-url: http://fint-core-consumer-${fint.consumer.domain}-${fint.consumer.package}:8080
    base-url: ${fint.relation.base-url}
    domain: utdanning
    package: vurdering
    packageName: ${fint.consumer.package}
    org-id: ${fint.org-id}
    coreVersionHeader: 2
    event:
      answer-deadline: 15m
      retention: 30m
    kafka:
      entity-concurrency: 6
      relation-concurrency: 6
      fetchMinBytes: 65536
      fetchMaxWaitMs: 10000

novari:
  kafka:
    topic:
      org-id: ${fint.org-id}
      domain-context: fint-core
    application-id: fint-core-consumer-${fint.consumer.domain}-${fint.consumer.package}-${fint.org-id}

spring:
  config:
    import:
      - classpath:shared-mongodb.yaml
  threads:
    virtual:
      enabled: true
  kafka:
    consumer:
      group-id: ${novari.kafka.application-id}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  webflux:
    base-path: ${fint.consumer.domain}/${fint.consumer.package}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health

logging:
  level:
    org.apache.kafka: WARN
    no.novari.kafka: WARN
